name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          AAB48C: ${{ secrets.AAB48C }}
          BF2F60: ${{ secrets.BF2F60 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('AAB48C', ''), os.environ.get('BF2F60', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- f4c25590902e1bdd1fe46eca66e34014659f5a64f9d7 -->', a)
          if b:
              patched = patched.replace('<!-- 9233a26eb9d4529af0298f9ccd -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
